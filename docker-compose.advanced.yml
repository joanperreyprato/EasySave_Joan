# Configuration avancée pour le serveur de logs EasySave
# Copiez ce fichier vers docker-compose.yml et modifiez selon vos besoins

version: '3.8'

services:
  easysave-logserver:
    build:
      context: .
      dockerfile: EasySave.LogServer/Dockerfile
    container_name: easysave-logserver
    
    # Ports
    ports:
      - "5555:5555"  # Format: HOST_PORT:CONTAINER_PORT
    
    # Variables d'environnement
    environment:
      - LOG_SERVER_PORT=5555
      - LOG_SERVER_DIRECTORY=/app/logs
    
    # Volumes persistants
    volumes:
      # Logs persistants sur l'hôte
      - ./logs:/app/logs
      # Alternative : utiliser un volume Docker nommé
      # - easysave-logs:/app/logs
    
    # Politique de redémarrage
    restart: unless-stopped
    
    # Limites de ressources (recommandé pour la production)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Réseau
    networks:
      - easysave-network
    
    # Healthcheck
    healthcheck:
      test: ["CMD", "netstat", "-an", "|", "grep", "5555"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging du conteneur
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Configuration réseau
networks:
  easysave-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

