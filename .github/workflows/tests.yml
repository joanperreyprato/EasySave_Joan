name: .NET Tests CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Run Tests
    runs-on: windows-latest # Required: EasySave.WPF targets net8.0-windows
    timeout-minutes: 20 # A hung test must never block the pipeline for hours

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore EasySave.sln

    - name: Build Solution
      run: dotnet build EasySave.sln --no-restore --configuration Release

    - name: Run Unit & Integration Tests
      # --blame-hang: a test blocked for 2 minutes is stopped and named in the log
      run: dotnet test EasySave.sln --no-build --configuration Release --verbosity normal --blame-hang --blame-hang-timeout 2min
