services:
  easysave-logserver:
    build:
      context: .
      dockerfile: EasySave.LogServer/Dockerfile
    container_name: easysave-logserver
    ports:
      - "5555:5555"
    environment:
      - LOG_SERVER_PORT=5555
      - LOG_SERVER_DIRECTORY=/app/logs
    volumes:
      # Persister les logs sur l'hôte
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - easysave-network

networks:
  easysave-network:
    driver: bridge
